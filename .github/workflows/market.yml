name: Collect NFL market reference

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/collect_market.py
      - scripts/verify_market.py
      - .github/workflows/market.yml
  schedule:
    - cron: '15 * * 1,9-12 0,1,4,5,6'
    - cron: '15 10 * 1,9-12 2,3'
    - cron: '15 10 * 2-8 1'

permissions:
  contents: write

concurrency:
  # Serialize commits with the statistics workflow to prevent push races.
  group: nfl-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SEASON: ${{ vars.NFL_SEASON || '2026' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: python -m pip install -r scripts/requirements.txt
      - name: Validate collectors
        run: python -m unittest discover -s scripts/tests -v
      - name: Collect live market observations
        id: market
        continue-on-error: true
        run: python scripts/collect_market.py --season "$SEASON" --require-fresh
      - name: Publish market files and status
        run: |
          git config user.name oracle-bot
          git config user.email oracle-bot@users.noreply.github.com
          git add docs/market/
          if ! git diff --staged --quiet; then
            git commit -m "Refresh NFL ${SEASON} market observations"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Verify raw and Pages publication
        if: steps.market.outcome == 'success'
        run: python scripts/verify_market.py --season "$SEASON" --repository "$GITHUB_REPOSITORY"
      - name: Surface market failure after publishing status
        if: steps.market.outcome == 'failure'
        run: exit 1
