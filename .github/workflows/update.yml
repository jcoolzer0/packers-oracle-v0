name: Collect NFL raw data

on:
  workflow_dispatch:
    inputs:
      season:
        description: Season to collect (blank uses NFL_SEASON repository variable or 2026)
        required: false
        type: string
  schedule:
    # Hourly on potential game days in season; daily Tue/Wed; weekly offseason.
    - cron: '15 * * 1,9-12 0,1,4,5,6'
    - cron: '15 10 * 1,9-12 2,3'
    - cron: '15 10 * 2-8 1'

permissions:
  contents: write

concurrency:
  group: nfl-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SEASON: ${{ inputs.season || vars.NFL_SEASON || '2026' }}
      ACTIVE_SEASON: ${{ vars.NFL_SEASON || '2026' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Validate collector
        run: python -m unittest discover -s scripts/tests -v
      - name: Restore conditional-download cache
        uses: actions/cache@v4
        with:
          path: .cache/nflverse
          key: nflverse-${{ runner.os }}-${{ github.run_id }}
          restore-keys: nflverse-${{ runner.os }}-
      - name: Collect and validate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SEASON" =~ ^[0-9]{4}$ ]] || { echo 'Season must be a four-digit year'; exit 1; }
          args=(--season "$SEASON")
          if [[ "$SEASON" != "$ACTIVE_SEASON" ]]; then
            args+=(--no-publish-latest)
          fi
          python scripts/build_data.py "${args[@]}"
      - name: Commit changed data only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name oracle-bot
          git config user.email oracle-bot@users.noreply.github.com
          git add docs/*.json docs/seasons/
          if ! git diff --staged --quiet; then
            git commit -m "Refresh NFL ${SEASON} raw data"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
